[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-study"
version = "0.1.0"
description = "Actuation latency tolerance of trajectory-tracking controllers"
# 3.7 is the floor because CARLA 0.9.15 ships a cp37 client wheel and that is
# the easiest env to pair with the server. Pins below are the oldest releases
# that work, so pip resolves to 3.7-compatible versions there and to current
# ones on a newer interpreter. Do not raise them without checking 3.7 again.
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.17",       # 3.7 resolves to 1.21.6
    "pandas>=1.1",       # 3.7 resolves to 1.3.5
    "matplotlib>=3.4",   # 3.7 resolves to 3.5.3; 3.4 for spines[[...]] indexing
    "PyYAML>=5.4",
]
# carla is installed separately: it must match your running server version.

[project.optional-dependencies]
dev = ["pytest>=7.0"]   # 7.x still supports 3.7; the pythonpath ini key needs 7.0+
record = ["pygame>=2.0"]  # only needed by scripts/record_trajectory.py

[project.scripts]
latency-sweep = "latency.sweep:main"
latency-analyze = "latency.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
